<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f2e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='15' cy='18' r='12' fill='%231f2230'/%3E%3Ccircle cx='26' cy='5' r='4' fill='%23ffcf33'/%3E%3C/svg%3E" />
    <title>Boomz — partie locale</title>
  </head>
  <body>
    <div id="app" class="layout">
      <section class="pad" data-player="1" aria-label="Manette du joueur 2">
        <div class="pad-info">
          <span class="pad-name">Joueur 2 · Blaster</span>
          <span class="pad-score" aria-label="Manches gagnées"></span>
          <span class="pad-status" aria-live="polite"></span>
          <span class="pad-keys">Flèches · Entrée</span>
        </div>
        <div class="pad-controls">
          <div class="stick-zone">
            <span class="stick-hint">Glisser pour bouger</span>
            <div class="stick-base"><div class="stick-knob"></div></div>
          </div>
          <button class="bomb-btn" type="button" aria-label="Poser une bombe">Bombe</button>
        </div>
      </section>

      <main class="board">
        <div class="board-frame">
          <canvas id="arena" aria-label="Arène"></canvas>
          <div class="hud-timer" hidden></div>
          <div class="overlay" id="overlay">
            <div class="overlay-card">
              <h1 class="title">Boomz</h1>
              <p class="overlay-text" id="overlay-text">
                Posez des bombes, détruisez les blocs et piégez votre adversaire.
                Le dernier debout gagne la manche — 3 manches pour le match.
              </p>
              <button class="primary-btn" id="overlay-btn" type="button">Jouer</button>
            </div>
          </div>
          <div class="countdown" id="countdown" hidden></div>
        </div>
      </main>

      <section class="pad" data-player="0" aria-label="Manette du joueur 1">
        <div class="pad-info">
          <span class="pad-name">Joueur 1 · Boomer</span>
          <span class="pad-score" aria-label="Manches gagnées"></span>
          <span class="pad-status" aria-live="polite"></span>
          <span class="pad-keys">ZQSD · Espace</span>
        </div>
        <div class="pad-controls">
          <div class="stick-zone">
            <span class="stick-hint">Glisser pour bouger</span>
            <div class="stick-base"><div class="stick-knob"></div></div>
          </div>
          <button class="bomb-btn" type="button" aria-label="Poser une bombe">Bombe</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/local.ts"></script>
  </body>
</html>
