name: Boomz iOS

# Fabrique l'application iPhone sur un Mac de GitHub, sans Mac à soi.
# - À chaque changement du jeu : vérifie que l'application compile (simulateur,
#   sans signature).
# - Lancement manuel (onglet Actions › Boomz iOS › Run workflow) : signe
#   l'application et l'envoie sur TestFlight, une fois renseignés les secrets
#   du dépôt APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8 (clé d'API
#   App Store Connect, rôle Admin, pour que les certificats soient gérés par
#   Apple).
on:
  push:
    paths:
      - 'boomz/**'
      - '.github/workflows/boomz-ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Envoyer la version sur TestFlight'
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: boomz
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boomz/package-lock.json

      - run: npm ci

      # Jeu compilé pour l'application (il se connecte à boomz.onrender.com), copié dans le projet iOS.
      - run: npm run build:app

      - name: Compilation (simulateur, sans signature)
        if: ${{ !inputs.testflight }}
        working-directory: boomz/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Archive signée et envoi sur TestFlight
        if: ${{ inputs.testflight }}
        working-directory: boomz/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant (Settings › Secrets and variables › Actions)"; exit 1; fi
          done
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archive non signée : la signer ici demanderait un certificat de
          # développement et un iPhone enregistré. C'est l'export qui la signe
          # pour l'App Store, avec un certificat de distribution géré par Apple.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Boomz.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Boomz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
