name: Boomz iOS

# Fabrique l'application iPhone sur un Mac de GitHub, sans Mac à soi.
# - À chaque changement du jeu : vérifie que l'application compile (simulateur,
#   sans signature).
# - Lancement manuel (onglet Actions › Boomz iOS › Run workflow) : signe
#   l'application et l'envoie sur TestFlight, une fois renseignés les secrets
#   du dépôt APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8 (clé d'API
#   App Store Connect, rôle Admin, pour que les certificats soient gérés par
#   Apple).
on:
  push:
    paths:
      - 'boomz/**'
      - '.github/workflows/boomz-ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Envoyer la version sur TestFlight'
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: boomz
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boomz/package-lock.json

      - run: npm ci

      # Jeu compilé pour l'application (il se connecte à boomz.onrender.com), copié dans le projet iOS.
      - run: npm run build:app

      - name: Compilation (simulateur, sans signature)
        if: ${{ !inputs.testflight }}
        working-directory: boomz/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Archive signée et envoi sur TestFlight
        if: ${{ inputs.testflight }}
        working-directory: boomz/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant (Settings › Secrets and variables › Actions)"; exit 1; fi
          done
          # Un espace ou un retour à la ligne collé avec l'identifiant suffit à faire refuser la clé.
          APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          # Emplacement et nom attendus par Xcode et altool.
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY"

          ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ASC_KEY_FILE="$KEY" BUNDLE_ID=fr.boomz.jeu \
            node ../../scripts/asc-check.mjs

          # Signature préparée par l'API App Store Connect (certificat de distribution
          # et profil App Store), puis rangée dans un trousseau temporaire.
          SIGN="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN"
          /usr/bin/openssl genrsa -out "$SIGN/dist.key" 2048 2>/dev/null
          /usr/bin/openssl req -new -key "$SIGN/dist.key" -out "$SIGN/dist.csr" -subj "/CN=Boomz GitHub/C=FR"
          ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ASC_KEY_FILE="$KEY" BUNDLE_ID=fr.boomz.jeu \
            CSR_FILE="$SIGN/dist.csr" OUT_DIR="$SIGN" node ../../scripts/asc-signing.mjs
          PROFILE_NAME='Boomz App Store (GitHub)'

          P12_PASS=$(uuidgen)
          /usr/bin/openssl x509 -inform der -in "$SIGN/distribution.cer" -out "$SIGN/distribution.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/dist.key" -in "$SIGN/distribution.pem" \
            -out "$SIGN/identity.p12" -passout pass:"$P12_PASS"
          KEYCHAIN="$RUNNER_TEMP/boomz.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$SIGN/identity.p12" -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          UUID=$(security cms -D -i "$SIGN/profile.mobileprovision" | plutil -extract UUID raw -)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$SIGN/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done

          # Signature manuelle avec ce certificat et ce profil, sur la seule cible
          # App en Release (passée en ligne de commande, elle toucherait aussi les
          # paquets Swift, qui n'acceptent pas de profil). Modification locale à
          # cette fabrication, jamais enregistrée dans le dépôt.
          TEAM="$APPLE_TEAM_ID" PROFILE="$PROFILE_NAME" python3 - <<'PY'
          import os
          path = 'App.xcodeproj/project.pbxproj'
          text = open(path).read()
          start = text.index('504EC3181FED79650016851F /* Release */ = {')
          end = text.index('name = Release;', start)
          block = text[start:end].replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              f'\t\t\t\tDEVELOPMENT_TEAM = {os.environ["TEAM"]};\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE"]}";',
          )
          open(path, 'w').write(text[:start] + block + text[end:])
          PY
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Boomz.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>fr.boomz.jeu</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Boomz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
