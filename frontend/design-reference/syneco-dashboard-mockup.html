<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SYNeco — Tableau de bord</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  :root{
    --petrol-deep:#0B3D3A;
    --petrol-mid:#155E52;
    --green:#2E9E63;
    --green-light:#5FDB92;
    --mint-bg:#EAF6EF;
    --card:#FFFFFF;
    --ink:#12211E;
    --muted:#5C7A72;
    --border:#DCEDE4;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Poppins',Arial,sans-serif;
    min-height:100vh;
    background:var(--mint-bg);
    color:var(--ink);
    position:relative;
    overflow-x:hidden;
  }

  /* halos discrets en fond, plus légers que sur la page de connexion */
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.28;
    z-index:0;
  }
  .blob.b1{width:560px;height:560px;background:radial-gradient(circle, var(--green-light), transparent 70%);top:-220px;left:-160px;}
  .blob.b2{width:460px;height:460px;background:radial-gradient(circle, var(--petrol-mid), transparent 70%);top:20%;right:-180px;}

  /* --- barre de navigation --- */
  nav{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 40px;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{width:34px;height:34px;flex:none;}
  .brand-name{font-size:18px;font-weight:700;color:var(--petrol-deep);}
  .brand-name span{color:var(--green);font-weight:600;}

  .nav-links{display:flex;align-items:center;gap:6px;}
  .nav-links a{
    text-decoration:none;
    color:var(--muted);
    font-size:14.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:10px;
    transition:background .15s ease, color .15s ease;
  }
  .nav-links a:hover{background:var(--mint-bg);color:var(--petrol-deep);}
  .nav-links a.active{
    background:linear-gradient(120deg, var(--petrol-deep), var(--green));
    color:#fff;
    font-weight:600;
  }
  .nav-links a.logout{color:#C0554B;}

  /* --- contenu --- */
  main{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:0 auto;
    padding:48px 40px;
  }
  h1{font-size:28px;font-weight:700;color:var(--petrol-deep);margin-bottom:32px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:28px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px 26px;
    box-shadow:0 8px 24px -14px rgba(11,61,58,0.12);
  }
  .stat-label{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px;}
  .stat-value{font-size:34px;font-weight:700;color:var(--petrol-deep);}
  .stat-card.accent .stat-value{color:var(--green);}

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px 28px;
    box-shadow:0 8px 24px -14px rgba(11,61,58,0.12);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .panel-head h2{font-size:17px;font-weight:600;color:var(--ink);}
  .panel-head a{font-size:14px;color:var(--green);font-weight:600;text-decoration:none;}
  .panel-head a:hover{text-decoration:underline;}

  .empty-state{
    font-size:14.5px;
    color:var(--muted);
    padding:18px 0 6px;
  }
</style>
</head>
<body>

  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <nav>
    <div class="brand">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B3D3A"/>
            <stop offset="100%" stop-color="#155E52"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EAF6EF"/>
            <stop offset="100%" stop-color="#8FD9B3"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="46" fill="url(#badgeGrad)"/>
        <g transform="translate(100,100)" fill="none" stroke="url(#leafGrad)" stroke-width="11" stroke-linecap="round">
          <path d="M -54 10 A 62 62 0 0 1 46 -46"/>
          <polygon points="46,-46 60,-30 30,-24" fill="#EAF6EF" stroke="none"/>
          <path d="M 54 -10 A 62 62 0 0 1 -46 46"/>
          <polygon points="-46,46 -60,30 -30,24" fill="#EAF6EF" stroke="none"/>
          <line x1="-30" y1="30" x2="30" y2="-30" stroke-width="7" opacity="0.85"/>
        </g>
      </svg>
      <div class="brand-name">SYN<span>eco</span></div>
    </div>

    <div class="nav-links">
      <a href="#" class="active">Dashboard</a>
      <a href="#">Documents</a>
      <a href="#">Échéances</a>
      <a href="#">Contrats</a>
      <a href="#">Notifications</a>
      <a href="#" class="logout">Déconnexion</a>
    </div>
  </nav>

  <main>
    <h1>Tableau de bord</h1>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Documents</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Échéances à faire</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-label">Échéances terminées</div>
        <div class="stat-value">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Prochaines échéances</h2>
        <a href="#">Voir tout</a>
      </div>
      <div class="empty-state">Aucune échéance à venir.</div>
    </div>
  </main>

</body>
</html>
