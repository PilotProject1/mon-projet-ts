    <!-- Données structurées (schema.org).
         Ce que les moteurs lisent pour comprendre de quoi parle le site sans
         avoir à l'interpréter : qui l'édite, ce qu'il propose, à quel prix.
         C'est ce qui permet à un résultat de recherche d'afficher autre
         chose qu'un titre et deux lignes.
         Rien n'est déclaré ici qui ne soit vrai ailleurs : les prix sont ceux
         des offres, l'éditeur celui des mentions légales. Aucune note ni
         aucun avis n'est annoncé — en inventer ferait disparaître la fiche
         entière des résultats, et mériterait de la faire disparaître. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://syneco.pro/#editeur",
            "name": "VincentLV",
            "alternateName": "SYNeco",
            "url": "https://syneco.pro/",
            "email": "syneco.pro@outlook.fr",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "9 rue Poincaré",
              "postalCode": "57240",
              "addressLocality": "Nilvange",
              "addressCountry": "FR"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Que deviennent mes documents si j’arrête de payer ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ils restent là, et restent consultables. Repasser à l’offre gratuite ne supprime jamais un document : la limite de dix ne fait qu’empêcher d’en ajouter de nouveaux tant que vous êtes au-dessus. Rien n’est effacé sans que vous le demandiez."
                }
              },
              {
                "@type": "Question",
                "name": "Puis-je récupérer mes documents et m’en aller ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Oui, à tout moment et sans rien demander à personne. Chaque fichier se télécharge depuis la liste des documents, et un export récupère l’ensemble de vos données — documents, échéances, contrats, partages. La suppression du compte efface les fichiers du stockage."
                }
              },
              {
                "@type": "Question",
                "name": "Qui peut lire mes documents ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Vous seul. Aucun fichier n’est accessible par une adresse publique : chaque ouverture passe par votre session et vérifie que le document vous appartient. Ce que vous partagez par lien expire au bout de 24 heures, 7 jours ou 30 jours, se révoque d’un clic, et chaque consultation est horodatée."
                }
              },
              {
                "@type": "Question",
                "name": "SYNeco lit-il vraiment le contenu de mes documents ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Oui, c’est ce qui distingue le service d’un simple espace de stockage : le type, l’émetteur, le montant et l’échéance sont reconnus dans le texte. Ces informations sont des suggestions, corrigeables d’un geste. Rien n’est utilisé pour entraîner un modèle, et la politique de confidentialité détaille précisément ce qui est transmis."
                }
              },
              {
                "@type": "Question",
                "name": "Faut-il installer une application ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Non. SYNeco fonctionne dans le navigateur, sur téléphone comme sur ordinateur. Vous pouvez l’ajouter à votre écran d’accueil pour l’ouvrir comme une application, mais rien ne vous y oblige."
                }
              },
              {
                "@type": "Question",
                "name": "Comment envoyer une facture reçue par e-mail ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "En transférant le message à votre adresse SYNeco personnelle. La pièce jointe est déposée et lue automatiquement, sans que vous ayez à la télécharger ni à ouvrir le site. Cela fonctionne depuis n’importe quelle messagerie."
                }
              }
            ]
          },
          {
            "@type": "SoftwareApplication",
            "name": "SYNeco",
            "url": "https://syneco.pro/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://syneco.pro/#editeur" },
            "description": "Coffre-fort administratif : SYNeco lit vos documents, en extrait les échéances et vous prévient avant qu'elles n'arrivent.",
            "offers": [
              {
                "@type": "Offer",
                "name": "Gratuit",
                "price": "0",
                "priceCurrency": "EUR",
                "description": "Jusqu'à 10 documents, toutes fonctions comprises"
              },
              {
                "@type": "Offer",
                "name": "Particulier Premium",
                "price": "4.99",
                "priceCurrency": "EUR",
                "description": "Documents illimités, sans engagement, par mois"
              },
              {
                "@type": "Offer",
                "name": "Professionnel",
                "price": "19.99",
                "priceCurrency": "EUR",
                "description": "Entreprise, clients et factures émises, sans engagement, par mois"
              }
            ]
          }
        ]
      }
    </script>

    <!-- Installation sur l'écran d'accueil (Android, Chrome, Edge). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b2e2f" />

    <!-- iOS ignore le manifeste : il lui faut ses propres balises. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SYNeco" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
