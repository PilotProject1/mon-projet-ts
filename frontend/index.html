<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/syneco-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SYNeco — Le coffre-fort administratif du particulier et de l’indépendant</title>
    <meta
      name="description"
      content="Photographiez un document : SYNeco le lit, repère son échéance et vous prévient avant qu’elle n’arrive. Gratuit jusqu’à 10 documents, sans engagement."
    />
    <link rel="canonical" href="https://syneco.pro/" />

    <!-- Aperçu des liens partagés. LinkedIn, WhatsApp et Slack n'exécutent
         pas le JavaScript : ces balises doivent rester dans le HTML servi,
         et non être posées par l'application une fois chargée. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SYNeco" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="SYNeco — Le coffre-fort administratif du particulier et de l’indépendant"
    />
    <meta
      property="og:description"
      content="Photographiez un document : SYNeco le lit, repère son échéance et vous prévient avant qu’elle n’arrive. Gratuit jusqu’à 10 documents, sans engagement."
    />
    <meta property="og:url" content="https://syneco.pro/" />
    <meta property="og:image" content="https://syneco.pro/og-syneco.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SYNeco, le coffre-fort administratif du particulier et de l’indépendant"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SYNeco — Le coffre-fort administratif du particulier et de l’indépendant"
    />
    <meta
      name="twitter:description"
      content="Photographiez un document : SYNeco le lit, repère son échéance et vous prévient avant qu’elle n’arrive."
    />
    <meta name="twitter:image" content="https://syneco.pro/og-syneco.png" />

    <!-- Données structurées (schema.org).
         Ce que les moteurs lisent pour comprendre de quoi parle le site sans
         avoir à l'interpréter : qui l'édite, ce qu'il propose, à quel prix.
         C'est ce qui permet à un résultat de recherche d'afficher autre
         chose qu'un titre et deux lignes.
         Rien n'est déclaré ici qui ne soit vrai ailleurs : les prix sont ceux
         des offres, l'éditeur celui des mentions légales. Aucune note ni
         aucun avis n'est annoncé — en inventer ferait disparaître la fiche
         entière des résultats, et mériterait de la faire disparaître. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://syneco.pro/#editeur",
            "name": "VincentLV",
            "alternateName": "SYNeco",
            "url": "https://syneco.pro/",
            "email": "syneco.pro@outlook.fr",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "9 rue Poincaré",
              "postalCode": "57240",
              "addressLocality": "Nilvange",
              "addressCountry": "FR"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "SYNeco",
            "url": "https://syneco.pro/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://syneco.pro/#editeur" },
            "description": "Coffre-fort administratif : SYNeco lit vos documents, en extrait les échéances et vous prévient avant qu'elles n'arrivent.",
            "offers": [
              {
                "@type": "Offer",
                "name": "Gratuit",
                "price": "0",
                "priceCurrency": "EUR",
                "description": "Jusqu'à 10 documents, toutes fonctions comprises"
              },
              {
                "@type": "Offer",
                "name": "Particulier Premium",
                "price": "4.99",
                "priceCurrency": "EUR",
                "description": "Documents illimités, sans engagement, par mois"
              },
              {
                "@type": "Offer",
                "name": "Professionnel",
                "price": "19.99",
                "priceCurrency": "EUR",
                "description": "Entreprise, clients et factures émises, sans engagement, par mois"
              }
            ]
          }
        ]
      }
    </script>

    <!-- Installation sur l'écran d'accueil (Android, Chrome, Edge). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b2e2f" />

    <!-- iOS ignore le manifeste : il lui faut ses propres balises. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SYNeco" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
